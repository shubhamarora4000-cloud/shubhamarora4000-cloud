<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="50%" stop-color="#0a111e"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="hubTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#004e8c"/>
    </linearGradient>
    <linearGradient id="hubSide1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005a9e"/>
      <stop offset="100%" stop-color="#002d5a"/>
    </linearGradient>
    <linearGradient id="hubSide2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#106ebe"/>
      <stop offset="100%" stop-color="#003966"/>
    </linearGradient>

    <linearGradient id="spokeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107c41"/>
      <stop offset="100%" stop-color="#0b552c"/>
    </linearGradient>
    <linearGradient id="spokeSide1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e6b37"/>
      <stop offset="100%" stop-color="#073b1e"/>
    </linearGradient>
    <linearGradient id="spokeSide2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#199e54"/>
      <stop offset="100%" stop-color="#0c5a2f"/>
    </linearGradient>

    <linearGradient id="drTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d83b01"/>
      <stop offset="100%" stop-color="#8e2600"/>
    </linearGradient>
    <linearGradient id="drSide1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a82e01"/>
      <stop offset="100%" stop-color="#5c1a00"/>
    </linearGradient>
    <linearGradient id="drSide2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea4a0a"/>
      <stop offset="100%" stop-color="#7a2200"/>
    </linearGradient>

    <linearGradient id="secTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#744da9"/>
      <stop offset="100%" stop-color="#492c73"/>
    </linearGradient>
    <linearGradient id="secSide1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c388a"/>
      <stop offset="100%" stop-color="#311952"/>
    </linearGradient>
    <linearGradient id="secSide2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5fc7"/>
      <stop offset="100%" stop-color="#43266d"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGlow)" rx="12"/>

  <!-- 3D Grid floor lines -->
  <g stroke="#1b2a4a" stroke-width="1" opacity="0.4">
    <line x1="500" y1="50" x2="950" y2="320"/>
    <line x1="500" y1="50" x2="50" y2="320"/>
    <line x1="500" y1="120" x2="950" y2="390"/>
    <line x1="500" y1="120" x2="50" y2="390"/>
    <line x1="500" y1="190" x2="950" y2="460"/>
    <line x1="500" y1="190" x2="50" y2="460"/>
    <line x1="500" y1="260" x2="950" y2="530"/>
    <line x1="500" y1="260" x2="50" y2="530"/>

    <line x1="200" y1="230" x2="650" y2="500"/>
    <line x1="300" y1="170" x2="750" y2="440"/>
    <line x1="400" y1="110" x2="850" y2="380"/>
    <line x1="600" y1="110" x2="150" y2="380"/>
    <line x1="700" y1="170" x2="250" y2="440"/>
    <line x1="800" y1="230" x2="350" y2="500"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 45)">
    <rect width="360" height="40" rx="8" fill="#14213d" stroke="#0078d4" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="8" fill="#00e5ff" filter="url(#neonGlow)"/>
    <text x="38" y="25" fill="#ffffff" font-size="14" font-weight="bold" letter-spacing="1">AZURE ENTERPRISE 3D ARCHITECTURE</text>
  </g>

  <!-- Status Chip -->
  <g transform="translate(680, 45)">
    <rect width="280" height="40" rx="8" fill="#112211" stroke="#00e676" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="7" fill="#00e676" filter="url(#neonGlow)"/>
    <text x="38" y="25" fill="#a7f3d0" font-size="13" font-weight="600">ZERO-TRUST • CIS BENCHMARK v2</text>
  </g>

  <!-- ================= ISOMETRIC HUB VNET (CENTER) ================= -->
  <!-- Base Plate Hub -->
  <g transform="translate(500, 240)">
    <!-- Top Face -->
    <polygon points="0,-60 140,20 0,100 -140,20" fill="url(#hubTop)" stroke="#00d2ff" stroke-width="2"/>
    <!-- Left Face -->
    <polygon points="-140,20 0,100 0,140 -140,60" fill="url(#hubSide1)"/>
    <!-- Right Face -->
    <polygon points="0,100 140,20 140,60 0,140" fill="url(#hubSide2)"/>

    <!-- Firewall Sub-pillar (3D mini tower) -->
    <g transform="translate(0, 10)">
      <polygon points="0,-35 35,-15 0,5 -35,-15" fill="#ff4d4f" stroke="#ff7875" stroke-width="1.5"/>
      <polygon points="-35,-15 0,5 0,35 -35,15" fill="#a8071a"/>
      <polygon points="0,5 35,-15 35,15 0,35" fill="#cf1322"/>
      <text x="0" y="-45" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Azure Firewall</text>
      <text x="0" y="55" fill="#ffccc7" font-size="10" font-weight="600" text-anchor="middle">Premium IDPS</text>
    </g>

    <text x="0" y="165" fill="#70b5ff" font-size="14" font-weight="bold" text-anchor="middle">HUB VNet (10.100.0.0/16)</text>
    <text x="0" y="183" fill="#a0c5e8" font-size="11" text-anchor="middle">Bastion • Gateway • DNS Resolver</text>
  </g>

  <!-- ================= ISOMETRIC SPOKE VNET (LEFT) ================= -->
  <g transform="translate(200, 360)">
    <!-- Top Face -->
    <polygon points="0,-50 120,20 0,90 -120,20" fill="url(#spokeTop)" stroke="#52c41a" stroke-width="2"/>
    <!-- Left Face -->
    <polygon points="-120,20 0,90 0,125 -120,55" fill="url(#spokeSide1)"/>
    <!-- Right Face -->
    <polygon points="0,90 120,20 120,55 0,125" fill="url(#spokeSide2)"/>

    <!-- App/DB Tier mini blocks -->
    <g transform="translate(-40, 10)">
      <polygon points="0,-20 22,-8 0,5 -22,-8" fill="#b7eb8f"/>
      <polygon points="-22,-8 0,5 0,22 -22,10" fill="#389e0d"/>
      <polygon points="0,5 22,-8 22,10 0,22" fill="#52c41a"/>
      <text x="0" y="-26" fill="#f6ffed" font-size="10" font-weight="bold" text-anchor="middle">App Tier</text>
    </g>
    <g transform="translate(40, 30)">
      <polygon points="0,-20 22,-8 0,5 -22,-8" fill="#95de64"/>
      <polygon points="-22,-8 0,5 0,22 -22,10" fill="#237804"/>
      <polygon points="0,5 22,-8 22,10 0,22" fill="#389e0d"/>
      <text x="0" y="38" fill="#f6ffed" font-size="10" font-weight="bold" text-anchor="middle">DB Subnet</text>
    </g>

    <text x="0" y="150" fill="#73d13d" font-size="14" font-weight="bold" text-anchor="middle">SPOKE Workload</text>
    <text x="0" y="168" fill="#b7eb8f" font-size="11" text-anchor="middle">10.101.0.0/16 • Private Endpoints</text>
  </g>

  <!-- ================= ISOMETRIC DR & BACKUP (RIGHT) ================= -->
  <g transform="translate(800, 360)">
    <!-- Top Face -->
    <polygon points="0,-50 120,20 0,90 -120,20" fill="url(#drTop)" stroke="#ff7a45" stroke-width="2"/>
    <!-- Left Face -->
    <polygon points="-120,20 0,90 0,125 -120,55" fill="url(#drSide1)"/>
    <!-- Right Face -->
    <polygon points="0,90 120,20 120,55 0,125" fill="url(#drSide2)"/>

    <!-- ASR & GRS Storage mini blocks -->
    <g transform="translate(0, 15)">
      <polygon points="0,-25 25,-10 0,5 -25,-10" fill="#ffd591"/>
      <polygon points="-25,-10 0,5 0,25 -25,10" fill="#d4380d"/>
      <polygon points="0,5 25,-10 25,10 0,25" fill="#fa541c"/>
      <text x="0" y="-32" fill="#fff2e8" font-size="10" font-weight="bold" text-anchor="middle">ASR Vault</text>
      <text x="0" y="42" fill="#ffe7ba" font-size="10" font-weight="bold" text-anchor="middle">RA-GRS Storage</text>
    </g>

    <text x="0" y="150" fill="#ff7a45" font-size="14" font-weight="bold" text-anchor="middle">SECONDARY DR REGION</text>
    <text x="0" y="168" fill="#ffbb96" font-size="11" text-anchor="middle">Site Recovery • GFS Backup</text>
  </g>

  <!-- ================= ZERO-TRUST SECURITY & SIEM (TOP CENTER) ================= -->
  <g transform="translate(500, 100)">
    <polygon points="0,-35 90,15 0,65 -90,15" fill="url(#secTop)" stroke="#b37feb" stroke-width="2"/>
    <polygon points="-90,15 0,65 0,90 -90,40" fill="url(#secSide1)"/>
    <polygon points="0,65 90,15 90,40 0,90" fill="url(#secSide2)"/>

    <text x="0" y="15" fill="#efdbff" font-size="12" font-weight="bold" text-anchor="middle">Key Vault &amp; Sentinel</text>
    <text x="0" y="32" fill="#d3adf7" font-size="10" text-anchor="middle">CMK 4096-bit • Defender for Cloud</text>
  </g>

  <!-- ================= 3D NEON CONNECTING DATA PIPELINES ================= -->
  <!-- Peering Hub to Spoke -->
  <path d="M 360,260 Q 280,280 200,310" fill="none" stroke="#00e5ff" stroke-width="3" stroke-dasharray="6,4" filter="url(#neonGlow)"/>
  <text x="260" y="270" fill="#00e5ff" font-size="10" font-weight="bold">Bi-directional Peering</text>

  <!-- UDR Spoke to Firewall -->
  <path d="M 240,335 Q 350,330 450,265" fill="none" stroke="#52c41a" stroke-width="2.5" stroke-dasharray="4,4"/>
  <text x="320" y="340" fill="#95de64" font-size="10" font-weight="bold">0.0.0.0/0 Force Tunnel</text>

  <!-- ASR Cross-Region Replication -->
  <path d="M 640,260 Q 720,290 800,310" fill="none" stroke="#fa8c16" stroke-width="3" stroke-dasharray="6,4" filter="url(#neonGlow)"/>
  <text x="690" y="270" fill="#ff9c6e" font-size="10" font-weight="bold">ASR Async Replication</text>

  <!-- Security Monitoring to Hub -->
  <path d="M 500,165 L 500,195" fill="none" stroke="#b37feb" stroke-width="3" stroke-dasharray="4,4" filter="url(#neonGlow)"/>

  <!-- Footer Stats Bar -->
  <g transform="translate(60, 555)">
    <rect width="880" height="30" rx="6" fill="#0b1329" stroke="#1f2d4f" stroke-width="1"/>
    <text x="30" y="20" fill="#8899aa" font-size="11">Architecture:</text>
    <text x="110" y="20" fill="#64b5f6" font-size="11" font-weight="bold">Hub &amp; Spoke CAF</text>
    
    <text x="250" y="20" fill="#8899aa" font-size="11">Security:</text>
    <text x="310" y="20" fill="#b388ff" font-size="11" font-weight="bold">Zero-Trust + Sentinel</text>
    
    <text x="470" y="20" fill="#8899aa" font-size="11">Resilience:</text>
    <text x="540" y="20" fill="#ffab40" font-size="11" font-weight="bold">ASR + RA-GRS + Traffic Mgr</text>

    <text x="730" y="20" fill="#8899aa" font-size="11">Governance:</text>
    <text x="810" y="20" fill="#69f0ae" font-size="11" font-weight="bold">FinOps + CIS Benchmarks</text>
  </g>
</svg>
